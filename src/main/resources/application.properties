spring.application.name=aquaventure

spring.datasource.url=jdbc:postgresql://localhost:5432/aquaventure_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.error.include-message=always
server.port=8080

jwt.secret=${JWT_SECRET:aquaventure_super_secret_key_2026_change_this_in_prod_32bytes}
jwt.expiration-ms=86400000

platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}
platform-admin.firstname=${PLATFORM_ADMIN_FIRSTNAME:Platform}
platform-admin.lastname=${PLATFORM_ADMIN_LASTNAME:Admin}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

app.storage.provider=local
app.storage.local.base-dir=${STORAGE_BASE_DIR:./uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.surf.suitability.beginner.max-wave-height-m=1.2
app.surf.suitability.beginner.max-wind-speed-kmh=20
app.surf.suitability.intermediate.max-wave-height-m=2.0
app.surf.suitability.intermediate.max-wind-speed-kmh=30
app.surf.suitability.advanced.max-wave-height-m=99
app.surf.suitability.advanced.max-wind-speed-kmh=99

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
